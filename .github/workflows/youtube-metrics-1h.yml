name: PLM Delayed YouTube 1h Metrics

on:
  workflow_run:
    workflows: ['PLM YouTube Pipeline']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch-one-hour:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: metrics-1h-delay
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dispatch targeted 1h collector
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/dispatch_delayed_1h.py
