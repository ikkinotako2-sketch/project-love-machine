name: PLM YouTube Pipeline
run-name: Pipeline ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      serverless_context:
        description: Exact serverless reservation metadata; empty preserves legacy path
        required: false
        default: ""
        type: string
      job_id:
        description: Unique n8n job ID; also used as render_id and idempotency key
        required: true
        type: string
      account_id:
        description: PLM YouTube account ID
        required: true
        type: string
      oauth_secret_name:
        description: Repository secret name beginning with PLM_YOUTUBE_
        required: true
        type: string
      title:
        description: YouTube video title
        required: true
        type: string
      hook:
        description: Opening hook
        required: false
        type: string
      narration:
        description: Japanese narration for VOICEVOX
        required: true
        type: string
      speaker:
        description: VOICEVOX speaker/style ID
        required: true
        default: "1"
        type: string
      scenes_json:
        description: JSON array of V2 scenes
        required: false
        default: "[]"
        type: string
      captions_json:
        description: JSON array of V2 captions
        required: false
        default: "[]"
        type: string
      bgm_json:
        description: JSON object for V2 BGM settings
        required: false
        default: "{}"
        type: string
      output_json:
        description: Render output specification
        required: false
        default: '{"format":"mp4","width":1080,"height":1920,"fps":30}'
        type: string
      description:
        description: YouTube description
        required: false
        type: string
      tags:
        description: Comma-separated YouTube tags
        required: false
        type: string
      privacy_status:
        description: private is the safe default
        required: true
        default: private
        type: choice
        options: [private, unlisted, public]
      scheduled_for:
        description: Future RFC3339 publish time; blank means immediate private upload
        required: false
        type: string
      made_for_kids:
        description: Explicit audience declaration
        required: true
        type: boolean
      contains_synthetic_media:
        description: Explicit synthetic/altered content declaration
        required: true
        type: boolean
      notify_subscribers:
        description: Notify subscribers
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: youtube-pipeline-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    env:
      PLM_JOB_ID: ${{ inputs.job_id }}
      PLM_RESULTS_BRANCH: plm-results
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Publish processing result
        run: python -m plm.entrypoints.publish_pipeline_result

      - name: Serverless bind checkpoint (explicit approval only)
        if: inputs.serverless_context != ''
        env:
          TEST_ONLY: ${{ vars.PLM_SERVERLESS_TEST_ONLY || 'true' }}
          DRY_RUN: ${{ vars.PLM_SERVERLESS_DRY_RUN || 'true' }}
          NO_PUBLISH: ${{ vars.PLM_SERVERLESS_NO_PUBLISH || 'true' }}
          EMERGENCY_STOP: ${{ vars.PLM_SERVERLESS_EMERGENCY_STOP || 'true' }}
          PLM_SERVERLESS_OPERATION_APPROVED: ${{ vars.PLM_SERVERLESS_APPROVED_JOB }}
          PLM_SERVERLESS_ORIGIN: ${{ vars.PLM_SERVERLESS_ORIGIN }}
          PLM_CHECKPOINT_KEY_ID: ${{ vars.PLM_CHECKPOINT_KEY_ID }}
          PLM_CALLBACK_KEY_ID: ${{ vars.PLM_CALLBACK_KEY_ID }}
          PLM_YOUTUBE_CHECKPOINT_KEY: ${{ secrets.PLM_YOUTUBE_CHECKPOINT_KEY }}
          PLM_YOUTUBE_RESULT_CALLBACK_KEY: ${{ secrets.PLM_YOUTUBE_RESULT_CALLBACK_KEY }}
        run: python -m plm.entrypoints.yt_serverless_candidate bind

  render:
    needs: initialize
    uses: ./.github/workflows/render-short.yml
    with:
      render_id: ${{ inputs.job_id }}
      title: ${{ inputs.title }}
      hook: ${{ inputs.hook }}
      narration: ${{ inputs.narration }}
      speaker: ${{ inputs.speaker }}
      scenes_json: ${{ inputs.scenes_json }}
      captions_json: ${{ inputs.captions_json }}
      bgm_json: ${{ inputs.bgm_json }}
      output_json: ${{ inputs.output_json }}

  checkpoint_render:
    if: inputs.serverless_context != ''
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      PLM_RENDER_RESULT_JSON: ${{ needs.render.outputs.result_json }}
    steps:
      - name: Checkout fixed candidate source
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download exact reusable render artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.render.outputs.artifact_name }}
          path: render-output
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Serverless render checkpoint (explicit approval only)
        if: inputs.serverless_context != ''
        env:
          TEST_ONLY: ${{ vars.PLM_SERVERLESS_TEST_ONLY || 'true' }}
          DRY_RUN: ${{ vars.PLM_SERVERLESS_DRY_RUN || 'true' }}
          NO_PUBLISH: ${{ vars.PLM_SERVERLESS_NO_PUBLISH || 'true' }}
          EMERGENCY_STOP: ${{ vars.PLM_SERVERLESS_EMERGENCY_STOP || 'true' }}
          PLM_SERVERLESS_OPERATION_APPROVED: ${{ vars.PLM_SERVERLESS_APPROVED_JOB }}
          PLM_SERVERLESS_ORIGIN: ${{ vars.PLM_SERVERLESS_ORIGIN }}
          PLM_CHECKPOINT_KEY_ID: ${{ vars.PLM_CHECKPOINT_KEY_ID }}
          PLM_CALLBACK_KEY_ID: ${{ vars.PLM_CALLBACK_KEY_ID }}
          PLM_YOUTUBE_CHECKPOINT_KEY: ${{ secrets.PLM_YOUTUBE_CHECKPOINT_KEY }}
          PLM_YOUTUBE_RESULT_CALLBACK_KEY: ${{ secrets.PLM_YOUTUBE_RESULT_CALLBACK_KEY }}
        run: python -m plm.entrypoints.yt_serverless_candidate render

  youtube:
    if: ${{ !cancelled() && needs.render.result == 'success' && (inputs.serverless_context == '' || needs.checkpoint_render.result == 'success') }}
    needs: [render, checkpoint_render]
    uses: ./.github/workflows/youtube-adapter.yml
    secrets: inherit
    with:
      operation: upload
      serverless_guard: ${{ inputs.serverless_context != '' }}
      account_id: ${{ inputs.account_id }}
      oauth_secret_name: ${{ inputs.oauth_secret_name }}
      render_run_id: ${{ format('{0}', github.run_id) }}
      render_artifact_name: ${{ needs.render.outputs.artifact_name }}
      title: ${{ inputs.title }}
      description: ${{ inputs.description }}
      tags: ${{ inputs.tags }}
      privacy_status: ${{ inputs.privacy_status }}
      scheduled_for: ${{ inputs.scheduled_for }}
      made_for_kids: ${{ inputs.made_for_kids }}
      contains_synthetic_media: ${{ inputs.contains_synthetic_media }}
      notify_subscribers: ${{ inputs.notify_subscribers }}
      idempotency_key: ${{ inputs.job_id }}

  result:
    if: always()
    needs: [render, youtube]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    env:
      PLM_JOB_ID: ${{ inputs.job_id }}
      PLM_RENDER_JOB_STATUS: ${{ needs.render.result }}
      PLM_YOUTUBE_JOB_STATUS: ${{ needs.youtube.result }}
      PLM_RENDER_RESULT_JSON: ${{ needs.render.outputs.result_json }}
      PLM_YOUTUBE_RESULT_PATH: adapter-result/youtube-result.json
      PLM_PIPELINE_RESULT_PATH: pipeline-result.json
      PLM_RESULTS_BRANCH: plm-results
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download YouTube Adapter result artifact
        if: needs.youtube.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: youtube-result-${{ github.run_id }}
          path: adapter-result
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Build pipeline result
        run: python -m plm.entrypoints.pipeline_result

      - name: Upload pipeline result for n8n
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-result-${{ inputs.job_id }}
          path: pipeline-result.json
          retention-days: 30

      - name: Publish fetchable pipeline result
        env:
          PLM_RESULT_SOURCE: pipeline-result.json
        run: python -m plm.entrypoints.publish_pipeline_result

      - name: Write job summary
        run: |
          echo '## PLM YouTube Pipeline Result' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat pipeline-result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Download render artifact for independent media readback
        if: inputs.serverless_context != '' && needs.render.result == 'success' && needs.youtube.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.render.outputs.artifact_name }}
          path: render-output
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Serverless result checkpoint (explicit approval only)
        if: inputs.serverless_context != '' && needs.render.result == 'success' && needs.youtube.result == 'success'
        env:
          TEST_ONLY: ${{ vars.PLM_SERVERLESS_TEST_ONLY || 'true' }}
          DRY_RUN: ${{ vars.PLM_SERVERLESS_DRY_RUN || 'true' }}
          NO_PUBLISH: ${{ vars.PLM_SERVERLESS_NO_PUBLISH || 'true' }}
          EMERGENCY_STOP: ${{ vars.PLM_SERVERLESS_EMERGENCY_STOP || 'true' }}
          PLM_SERVERLESS_OPERATION_APPROVED: ${{ vars.PLM_SERVERLESS_APPROVED_JOB }}
          PLM_SERVERLESS_ORIGIN: ${{ vars.PLM_SERVERLESS_ORIGIN }}
          PLM_CHECKPOINT_KEY_ID: ${{ vars.PLM_CHECKPOINT_KEY_ID }}
          PLM_CALLBACK_KEY_ID: ${{ vars.PLM_CALLBACK_KEY_ID }}
          PLM_YOUTUBE_OAUTH_JSON: ${{ secrets[inputs.oauth_secret_name] }}
          PLM_YOUTUBE_CHECKPOINT_KEY: ${{ secrets.PLM_YOUTUBE_CHECKPOINT_KEY }}
          PLM_YOUTUBE_RESULT_CALLBACK_KEY: ${{ secrets.PLM_YOUTUBE_RESULT_CALLBACK_KEY }}
        run: python -m plm.entrypoints.yt_serverless_candidate result
