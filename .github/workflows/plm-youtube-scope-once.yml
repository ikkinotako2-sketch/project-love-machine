name: PLM YouTube Scope Diagnostic Once
on:
  push:
    branches: [plm-youtube-scope-readiness-20261012-r1]
    paths: [audit-evidence/consumed/provider-neutral-youtube-oauth-scope-diagnostic-20261012-r1.json]
permissions:
  contents: read
concurrency:
  group: provider-neutral-youtube-oauth-scope-diagnostic-20261012-r1
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'PLM YouTube OAuth scope once provider-neutral-youtube-oauth-scope-diagnostic-20261012-r1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TEST_ONLY: 'true'
      DRY_RUN: 'true'
      NO_PUBLISH: 'true'
      EMERGENCY_STOP: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Secret-free exact marker and history gate
        run: python -m readiness.youtube_scope_once --gate
      - name: One refresh POST and booleans only
        env:
          PLM_YOUTUBE_OAUTH_JSON: ${{ secrets.PLM_YOUTUBE_GAME_001 }}
        run: python -m readiness.youtube_scope_once
